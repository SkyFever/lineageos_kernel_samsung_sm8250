name: Build Kernel (Z Fold 2)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex libelf-dev \
            libssl-dev libncurses-dev python3 zstd

      - name: Setup Clang
        run: |
          mkdir -p $HOME/clang
          # neutron-clang 릴리즈 목록: https://github.com/Neutron-Toolchains/clang-build-catalogue/releases
          CLANG_TAG="18.1.8-20240726"
          curl -Lo clang.tar.zst \
            "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/${CLANG_TAG}/neutron-clang-${CLANG_TAG}.tar.zst"
          tar --use-compress-program=zstd -xf clang.tar.zst -C $HOME/clang
          echo "$HOME/clang/bin" >> $GITHUB_PATH

      - name: Install GCC cross compiler
        run: |
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Merge configs and build
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1

          # 1단계: Qualcomm 베이스 defconfig
          make O=out \
            ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            vendor/kona-perf_defconfig

          # 2단계: Samsung 공통 + F2Q 기기 config 순서대로 병합
          ./scripts/kconfig/merge_config.sh -m -O out \
            out/.config \
            arch/arm64/configs/vendor/samsung/kona-sec-common.config \
            arch/arm64/configs/vendor/samsung/f2q.config

          # 3단계: 병합 후 빠진 값 자동 보완
          make O=out \
            ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          # 4단계: 빌드
          make -j$(nproc) O=out \
            ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-f2q
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
