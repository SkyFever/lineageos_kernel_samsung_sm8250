name: Build Samsung F2Q Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        apt-get update
        apt-get install -y git bc bison flex libssl-dev make gcc-aarch64-linux-gnu build-essential curl libncurses5-dev libncurses5 python3

    - name: Setup Clang Toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Fix Source Code Errors
      run: |
        # 1. techpack/audio: 함수 선언 타입 불일치 수정 (void -> int)
        sed -i 's/void sec_pcie_l1ss_enable(int);/int sec_pcie_l1ss_enable(int);/' techpack/audio/asoc/msm-pcm-q6-noirq.c
        sed -i 's/void sec_pcie_l1ss_disable(int);/int sec_pcie_l1ss_disable(int);/' techpack/audio/asoc/msm-pcm-q6-noirq.c

        # 2. techpack/camera: 헤더 파일 경로 수정
        sed -i 's|#include "cam_req_mgr_interface.h"|#include "../cam_req_mgr/cam_req_mgr_interface.h"|' techpack/camera/drivers/cam_utils/cam_trace.h

        # 3. drivers/input/touchscreen: sec_class 헤더 추가
        # includes.h가 있다면 거기에 추가하거나, 소스 파일 상단에 직접 추가
        sed -i '/#include <linux\/module.h>/a #include <linux\/sec_class.h>' drivers/input/touchscreen/sec_ts/y79a_c/sec_ts_only_vendor.c

        # 4. f2q.config에 CONFIG_SEC_CLASS=y 추가 (이미 있다면 중복 방지)
        if ! grep -q "CONFIG_SEC_CLASS=y" arch/arm64/configs/vendor/samsung/f2q.config; then
          echo "CONFIG_SEC_CLASS=y" >> arch/arm64/configs/vendor/samsung/f2q.config
        fi

    - name: Configure Kernel
      env:
        ARCH: arm64
        SUBARCH: arm64
        CC: ${{ github.workspace }}/clang/bin/clang
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        NM: ${{ github.workspace }}/clang/bin/llvm-nm
        AR: ${{ github.workspace }}/clang/bin/llvm-ar
        OBJCOPY: ${{ github.workspace }}/clang/bin/llvm-objcopy
        OBJDUMP: ${{ github.workspace }}/clang/bin/llvm-objdump
        STRIP: ${{ github.workspace }}/clang/bin/llvm-strip
      run: |
        make mrproper
        make vendor/kona_defconfig
        ./scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/samsung/f2q.config
        make olddefconfig

    - name: Build Kernel
      env:
        ARCH: arm64
        SUBARCH: arm64
        CC: ${{ github.workspace }}/clang/bin/clang
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        NM: ${{ github.workspace }}/clang/bin/llvm-nm
        AR: ${{ github.workspace }}/clang/bin/llvm-ar
        OBJCOPY: ${{ github.workspace }}/clang/bin/llvm-objcopy
        OBJDUMP: ${{ github.workspace }}/clang/bin/llvm-objdump
        STRIP: ${{ github.workspace }}/clang/bin/llvm-strip
      run: |
        make -j$(nproc) Image.gz dtbs

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz
        path: arch/arm64/boot/Image.gz

    - name: Upload DTB
      uses: actions/upload-artifact@v4
      with:
        name: dtb-files
        path: arch/arm64/boot/dts/vendor/qcom/*.dtb
