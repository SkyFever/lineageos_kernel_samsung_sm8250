name: Build Samsung F2Q Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        apt-get update
        apt-get install -y git bc bison flex libssl-dev make gcc-aarch64-linux-gnu build-essential curl libncurses5-dev libncurses5 python3 cpio rsync libelf-dev

    - name: Setup Clang Toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Patch Kernel Source
      run: |
        echo "Applying Fixes..."

        # Fix 1: 'L1SS_AUDIO' undeclared error
        # L1SS_AUDIO 상수가 정의된 헤더가 누락된 것으로 보임.
        # 임시 방편으로 해당 파일 상단에 직접 정의를 추가하거나, 
        # 삼성 커널에서 자주 쓰이는 sec_pcie.h 헤더를 include 하도록 수정.
        # 여기서는 가장 안전하게 include를 추가하고, 그래도 안 되면 상수를 직접 정의하는 방어 코드를 넣습니다.
        
        TARGET_FILE="techpack/audio/asoc/msm-pcm-q6-noirq.c"
        if [ -f "$TARGET_FILE" ]; then
            # 헤더 추가 시도 (include linux/sec_pcie.h)
            sed -i '/#include <linux\/module.h>/a #include <linux/sec_pcie.h>' $TARGET_FILE
            
            # 만약 헤더에도 없다면 강제로 정의 (값은 보통 0 또는 1, 여기선 더미 값으로 처리해 빌드 통과 유도)
            # 주의: 실제 기능에 영향을 줄 수 있으나 빌드 통과를 우선시 함.
            sed -i '/#include <linux\/sec_pcie.h>/a #ifndef L1SS_AUDIO\n#define L1SS_AUDIO 0\n#endif' $TARGET_FILE
        fi

        # Fix 2: trace.h fatal error in drivers/clk/qcom/clk-debug.c
        # Makefile에 헤더 검색 경로(-I.)가 누락되어 발생하는 문제입니다.
        # drivers/clk/qcom/Makefile 파일에 CFLAGS_clk-debug.o 설정을 추가합니다.
        
        MAKEFILE_QCOM="drivers/clk/qcom/Makefile"
        if [ -f "$MAKEFILE_QCOM" ]; then
            echo "CFLAGS_clk-debug.o := -I\$(src)" >> $MAKEFILE_QCOM
        fi

    - name: Configure Kernel
      env:
        ARCH: arm64
        SUBARCH: arm64
        CC: ${{ github.workspace }}/clang/bin/clang
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      run: |
        make mrproper
        
        # Merge configs
        scripts/kconfig/merge_config.sh -m -O . arch/arm64/configs/vendor/kona_defconfig arch/arm64/configs/vendor/samsung/f2q.config

        # Disable LTO & Werror
        ./scripts/config --file .config --disable LTO
        ./scripts/config --file .config --disable LTO_CLANG
        ./scripts/config --file .config --disable THINLTO
        ./scripts/config --file .config --disable CFI_CLANG
        
        # 경고를 에러로 처리하는 옵션 끄기 (추가적인 안전장치)
        ./scripts/config --file .config --disable CONFIG_WERROR

        make olddefconfig

    - name: Build Kernel
      env:
        ARCH: arm64
        SUBARCH: arm64
        CC: ${{ github.workspace }}/clang/bin/clang
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        NM: ${{ github.workspace }}/clang/bin/llvm-nm
        AR: ${{ github.workspace }}/clang/bin/llvm-ar
        OBJCOPY: ${{ github.workspace }}/clang/bin/llvm-objcopy
        OBJDUMP: ${{ github.workspace }}/clang/bin/llvm-objdump
        STRIP: ${{ github.workspace }}/clang/bin/llvm-strip
      run: |
        # KCFLAGS="-w": 모든 경고 무시
        # -Wno-error: 경고를 에러로 처리하지 않음
        make -j$(nproc) KCFLAGS="-w -Wno-error" Image dtbs

    - name: Pack Image
      run: |
        gzip -c arch/arm64/boot/Image > arch/arm64/boot/Image.gz

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz
        path: arch/arm64/boot/Image.gz

    - name: Upload DTB
      uses: actions/upload-artifact@v4
      with:
        name: dtb-files
        path: arch/arm64/boot/dts/vendor/qcom/*.dtb
