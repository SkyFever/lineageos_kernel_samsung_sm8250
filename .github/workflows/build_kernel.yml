name: Build Kernel (Z Fold 2)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex libelf-dev \
            libssl-dev libncurses-dev python3 zstd \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi
          
          sudo ln -sf /usr/bin/clang-14    /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-14   /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-14  /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14  /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14  /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14  /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-14    /usr/local/bin/llvm-strip

      - name: Install mkdtimg
        run: |
          # AOSP prebuilts에서 mkdtimg 받기
          curl -Lo mkdtimg \
            "https://github.com/LineageOS/android_prebuilts_misc/raw/master/linux-x86/dtc/mkdtimg"
          chmod +x mkdtimg
          sudo mv mkdtimg /usr/local/bin/

      - name: Merge configs and build
        run: |
          set -o pipefail

          make O=out \
            ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            vendor/kona-perf_defconfig

          ./scripts/kconfig/merge_config.sh -m -O out \
            out/.config \
            arch/arm64/configs/vendor/samsung/kona-sec-common.config \
            arch/arm64/configs/vendor/samsung/f2q.config

          make O=out \
            ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          # 커널 + dtbs 같이 빌드
          make -j$(nproc) O=out \
            ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error=vla-extension" \
            Image dtbs \
            2>&1 | tee build.log

      - name: Create dtbo.img
        run: |
          # .dtbo 파일 찾기
          DTBO_FILES=$(find out/arch/arm64/boot/dts -name "*.dtbo" | sort)
          echo "Found dtbo files:"
          echo "$DTBO_FILES"

          if [ -z "$DTBO_FILES" ]; then
            echo "Warning: No .dtbo files found"
            exit 1
          fi

          mkdtimg create out/arch/arm64/boot/dtbo.img $DTBO_FILES

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-f2q
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
