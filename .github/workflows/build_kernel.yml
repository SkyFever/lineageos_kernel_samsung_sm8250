name: Build Kernel (Z Fold 2)

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region variant'
        required: true
        default: 'EUR_OPEN'
        type: choice
        options:
          - EUR_OPEN
          - USA_SINGLE
          - KOR_SINGLE
          - JPN_SINGLE

      watchdog:
        description: 'watchdog variant'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex libelf-dev \
            libssl-dev libncurses-dev python3 zstd \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi
          
          sudo ln -sf /usr/bin/clang-14    /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-14   /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-14  /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14  /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14  /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14  /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-14    /usr/local/bin/llvm-strip

      - name: Install mkdtboimg
        run: |
          # -o 없이 stdout으로 받아서 base64 디코딩
          curl -s \
            "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/master/utils/src/mkdtboimg.py?format=TEXT" \
            | base64 -d > /usr/local/bin/mkdtboimg
          chmod +x /usr/local/bin/mkdtboimg
          # 정상 설치 확인
          head -1 /usr/local/bin/mkdtboimg   # #!/usr/bin/env python3 이 나와야 함

      - name: Apply region config
        run: |
          REGION="${{ github.event.inputs.region }}"
          CONFIG="arch/arm64/configs/vendor/samsung/f2q.config"

          # 모든 MACH_F2Q 옵션 비활성화
          sed -i '/^CONFIG_MACH_F2Q_/d' $CONFIG
          sed -i '/^# CONFIG_MACH_F2Q_/d' $CONFIG

          # 선택한 region만 활성화
          echo "CONFIG_MACH_F2Q_${REGION}=y" >> $CONFIG

          echo "Applied region: $REGION"
          grep "MACH_F2Q" $CONFIG

      - name: Apply watchdog config
        run: |
          WATCHDOG="${{ github.event.inputs.watchdog }}"
          CONFIG_PERF="arch/arm64/configs/vendor/kona-perf_defconfig"
          CONFIG_SEC="arch/arm64/configs/vendor/samsung/kona-sec-common.config"

          # 기존 Watchdog 관련 설정 제거
          sed -i '/^CONFIG_QCOM_WATCHDOG_V2/d' $CONFIG_PERF
          sed -i '/^# CONFIG_QCOM_WATCHDOG_V2/d' $CONFIG_PERF
          sed -i '/^CONFIG_WATCHDOG/d' $CONFIG_SEC
          sed -i '/^# CONFIG_WATCHDOG/d' $CONFIG_SEC
          sed -i '/^CONFIG_SOFT_WATCHDOG/d' $CONFIG_SEC
          sed -i '/^# CONFIG_SOFT_WATCHDOG/d' $CONFIG_SEC
          sed -i '/^CONFIG_WATCHDOG_CORE/d' $CONFIG_SEC
          sed -i '/^# CONFIG_WATCHDOG_CORE/d' $CONFIG_SEC
          sed -i '/^CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED/d' $CONFIG_SEC
          sed -i '/^# CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED/d' $CONFIG_SEC
          

          if [ "$WATCHDOG" = "true" ]; then
            echo "CONFIG_QCOM_WATCHDOG_V2=y" >> $CONFIG_PERF
            echo "CONFIG_WATCHDOG=y" >> $CONFIG_SEC
            echo "CONFIG_SOFT_WATCHDOG=y" >> $CONFIG_SEC
            echo "CONFIG_WATCHDOG_CORE=y" >> $CONFIG_SEC
            echo "CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED=y" >> $CONFIG_SEC
            echo "Watchdog is ENABLED."
          else
            echo "# CONFIG_QCOM_WATCHDOG_V2 is not set" >> $CONFIG_PERF
            echo "# CONFIG_WATCHDOG is not set" >> $CONFIG_SEC
            echo "# CONFIG_SOFT_WATCHDOG is not set" >> $CONFIG_SEC
            echo "# CONFIG_WATCHDOG_CORE is not set" >> $CONFIG_SEC
            echo "# CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED in not set" >> $CONFIG_SEC
            echo "Watchdog is DISABLED."
          fi

          echo "Selected watchdog value: $WATCHDOG"
          grep "WATCHDOG" $CONFIG_PERF || true
          grep "WATCHDOG" $CONFIG_SEC || true

      - name: Setup magiskboot
        run: |
          curl -Lo magiskboot \
            "https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk"
          # apk는 zip이라 안에서 magiskboot만 추출
          unzip -o magiskboot -d magisk_tmp 'lib/x86_64/libmagiskboot.so'
          cp magisk_tmp/lib/x86_64/libmagiskboot.so /usr/local/bin/magiskboot
          chmod +x /usr/local/bin/magiskboot

      - name: Install avbtool
        run: |
          # raw 파일 직접 다운로드
          curl -Lo /usr/local/bin/avbtool \
            "https://raw.githubusercontent.com/LineageOS/android_external_avb/refs/heads/lineage-23.2/avbtool.py"
          sudo chmod +x /usr/local/bin/avbtool
          avbtool version

      - name: Merge configs and build
        run: |
          set -o pipefail

          make O=out \
            ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            vendor/kona-perf_defconfig

          ./scripts/kconfig/merge_config.sh -m -O out \
            out/.config \
            arch/arm64/configs/vendor/samsung/kona-sec-common.config \
            arch/arm64/configs/vendor/samsung/f2q.config

          make O=out \
            ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          # 커널 + dtbs 같이 빌드
          make -j$(nproc) O=out \
            ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error=vla-extension" \
            Image dtbs \
            2>&1 | tee build.log

      - name: Create dtbo.img
        run: |
          REGION="${{ github.event.inputs.region }}"

          # EUR_OPEN → eur, KOR_SINGLE → kor 등 소문자 앞부분만 추출
          REGION_LOWER=$(echo "$REGION" | tr '[:upper:]' '[:lower:]' | cut -d'_' -f1)
          echo "Looking for dtbo pattern: *-${REGION_LOWER}-*"

          DTBO_FILES=$(find out/arch/arm64/boot/dts/samsung/f2q \
            -name "*-${REGION_LOWER}-*.dtbo" | sort)
          echo "Found dtbo files:"
          echo "$DTBO_FILES"

          if [ -z "$DTBO_FILES" ]; then
            echo "Error: No .dtbo files found for region $REGION"
            exit 1
          fi

          mkdtboimg create out/arch/arm64/boot/dtbo.img $DTBO_FILES

      - name: Repack boot.img
        run: |
          mkdir -p boot_work
          cp stock_boot.img boot_work/
          cd boot_work

          # 언팩
          magiskboot unpack stock_boot.img

          # 커널 교체
          cp ../out/arch/arm64/boot/Image kernel

          # 리팩
          magiskboot repack stock_boot.img ../boot.img

          cd ..

      - name: Create vbmeta (AVB disabled)
        run: |
          avbtool make_vbmeta_image \
            --flag 2 \
            --padding_size 4096 \
            --output vbmeta.img

      - name: Package for Odin
        run: |
          # boot.tar.md5
          tar -cf boot.tar.md5 boot.img
          md5sum -t boot.tar.md5 >> boot.tar.md5

          # dtbo.tar.md5
          tar -cf dtbo.tar.md5 out/arch/arm64/boot/dtbo.img
          md5sum -t dtbo.tar.md5 >> dtbo.tar.md5

          # vbmeta.tar.md5
          tar -cf vbmeta.tar.md5 vbmeta.img
          md5sum -t vbmeta.tar.md5 >> vbmeta.tar.md5

      - name: Upload Odin flashable
        uses: actions/upload-artifact@v4
        with:
          name: odin-f2q
          path: |
            boot.tar.md5
            dtbo.tar.md5
            vbmeta.tar.md5

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-f2q
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
