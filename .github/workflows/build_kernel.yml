name: Build Samsung F2Q Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        apt-get update
        apt-get install -y git bc bison flex libssl-dev make gcc-aarch64-linux-gnu build-essential curl libncurses5-dev libncurses5 python3 cpio rsync libelf-dev

    - name: Setup Clang Toolchain
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Patch Kernel Source (All Fixes)
      run: |
        echo "Applying All Compilation Fixes..."

        # Fix 1: Audio L1SS_AUDIO error
        # techpack/audio/asoc/msm-pcm-q6-noirq.c
        TARGET_FILE="techpack/audio/asoc/msm-pcm-q6-noirq.c"
        if [ -f "$TARGET_FILE" ]; then
            sed -i '/#include <linux\/module.h>/a #include <linux/sec_pcie.h>' $TARGET_FILE
            sed -i '/#include <linux\/sec_pcie.h>/a #ifndef L1SS_AUDIO\n#define L1SS_AUDIO 0\n#endif' $TARGET_FILE
        fi

        # Fix 2: Clock Trace error (drivers/clk/qcom)
        MAKEFILE_QCOM="drivers/clk/qcom/Makefile"
        if [ -f "$MAKEFILE_QCOM" ]; then
            echo "CFLAGS_clk-debug.o := -I\$(src)" >> $MAKEFILE_QCOM
        fi

        # Fix 3: HID Trace error (drivers/hid)
        MAKEFILE_HID="drivers/hid/Makefile"
        if [ -f "$MAKEFILE_HID" ]; then
            echo "CFLAGS_hid-trace.o := -I\$(src)" >> $MAKEFILE_HID
        fi

        # Fix 4: Camera Header Path error (techpack/camera)
        # cam_req_mgr_core.h 파일을 찾지 못하는 문제. 
        # 상대 경로로 include하거나 Makefile에 경로 추가.
        # 가장 확실한 방법은 Makefile에 해당 경로를 추가해주는 것입니다.
        CAM_MAKEFILE="techpack/camera/drivers/cam_req_mgr/Makefile"
        if [ -f "$CAM_MAKEFILE" ]; then
             # ccflags-y에 현재 디렉토리 추가
             echo "ccflags-y += -I\$(src)" >> $CAM_MAKEFILE
        fi
        
        # cam_trace.h 파일에서 상대 경로 문제일 수 있으므로 파일 자체 수정 시도
        CAM_TRACE_FILE="techpack/camera/drivers/cam_utils/cam_trace.h"
        if [ -f "$CAM_TRACE_FILE" ]; then
            # #include "cam_req_mgr_core.h" -> #include "../cam_req_mgr/cam_req_mgr_core.h"
            sed -i 's|#include "cam_req_mgr_core.h"|#include "../cam_req_mgr/cam_req_mgr_core.h"|g' $CAM_TRACE_FILE
        fi

        # Fix 5: lib/fault-inject.c WRITE_ONCE error
        # WRITE_ONCE 매크로가 do { ... } while(0) 형태인데, if 문 조건식 안에서 값으로 사용되려 해서 발생.
        # fail_nth = WRITE_ONCE(..., ...) 형태로 분리해야 함.
        # sed로 코드를 수정합니다.
        FAULT_FILE="lib/fault-inject.c"
        if [ -f "$FAULT_FILE" ]; then
            # 해당 라인: if (!WRITE_ONCE(current->fail_nth, fail_nth - 1))
            # 수정: WRITE_ONCE 호출 후 값 체크 로직으로 변경하기엔 복잡하므로,
            # 컴파일러가 'do-while'을 expression statement로 인식하도록 ({ ... }) 로 감싸는 GCC 확장을 유도하거나
            # 그냥 간단하게 해당 구문을 주석처리 하거나 수정.
            
            # 가장 안전한 수정: WRITE_ONCE 매크로 대신 직접 할당으로 변경 (atomic 보장은 떨어지지만 빌드는 됨)
            # 또는 원본 코드 구조상 current->fail_nth 값을 먼저 갱신하고 체크.
            
            # sed를 이용한 코드 치환 (WRITE_ONCE 제거)
            sed -i 's/if (!WRITE_ONCE(current->fail_nth, fail_nth - 1))/current->fail_nth = fail_nth - 1; if (!current->fail_nth)/g' $FAULT_FILE
        fi

    - name: Configure Kernel
      env:
        ARCH: arm64
        SUBARCH: arm64
        CC: ${{ github.workspace }}/clang/bin/clang
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      run: |
        make mrproper
        
        # Merge configs
        scripts/kconfig/merge_config.sh -m -O . arch/arm64/configs/vendor/kona_defconfig arch/arm64/configs/vendor/samsung/f2q.config

        # Disable LTO & Error checks
        ./scripts/config --file .config --disable LTO
        ./scripts/config --file .config --disable LTO_CLANG
        ./scripts/config --file .config --disable THINLTO
        ./scripts/config --file .config --disable CFI_CLANG
        ./scripts/config --file .config --disable CONFIG_WERROR
        
        # FAULT_INJECTION을 끄는 것도 5번 에러의 해결책 중 하나
        ./scripts/config --file .config --disable FAULT_INJECTION
        ./scripts/config --file .config --disable FAULT_INJECTION_DEBUG_FS

        make olddefconfig

    - name: Build Kernel
      env:
        ARCH: arm64
        SUBARCH: arm64
        CC: ${{ github.workspace }}/clang/bin/clang
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        NM: ${{ github.workspace }}/clang/bin/llvm-nm
        AR: ${{ github.workspace }}/clang/bin/llvm-ar
        OBJCOPY: ${{ github.workspace }}/clang/bin/llvm-objcopy
        OBJDUMP: ${{ github.workspace }}/clang/bin/llvm-objdump
        STRIP: ${{ github.workspace }}/clang/bin/llvm-strip
      run: |
        make -j$(nproc) KCFLAGS="-w -Wno-error" Image dtbs

    - name: Pack Image
      run: |
        gzip -c arch/arm64/boot/Image > arch/arm64/boot/Image.gz

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz
        path: arch/arm64/boot/Image.gz

    - name: Upload DTB
      uses: actions/upload-artifact@v4
      with:
        name: dtb-files
        path: arch/arm64/boot/dts/vendor/qcom/*.dtb
